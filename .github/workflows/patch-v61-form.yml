name: Patch v6.1 form identifiers

on:
  push:
    branches:
      - feature/cf2static-v6.1

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Temporarily patch form version identifiers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cf2static-v6.1
          fetch-depth: 0
      - name: Replace exact version identifiers
        shell: python
        run: |
          from pathlib import Path
          p = Path('VBA/frmExcelNavigator.frm')
          s = p.read_text(encoding='utf-8')
          a = 'ExcelNavigator v6.0'
          b = 'ExcelNavigator_v6.0'
          assert s.count(a) == 1, f'Expected one display version, found {s.count(a)}'
          assert s.count(b) == 1, f'Expected one registry version, found {s.count(b)}'
          s = s.replace(a, 'ExcelNavigator v6.1')
          s = s.replace(b, 'ExcelNavigator_v6.1')
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- VBA/frmExcelNavigator.frm
          git commit -m "Update form version identifiers to v6.1"
          git push origin HEAD:feature/cf2static-v6.1
