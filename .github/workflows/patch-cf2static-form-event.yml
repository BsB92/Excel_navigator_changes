name: Patch CF2Static form event

on:
  push:
    branches:
      - feature/cf2static-v6.1

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger CF2Static form event patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cf2static-v6.1
          fetch-depth: 0
      - name: Patch form
        shell: python
        run: |
          from pathlib import Path
          p = Path('VBA/frmExcelNavigator.frm')
          s = p.read_text(encoding='utf-8')

          old_decl = 'Private WithEvents mBtnFrameCopyWithSuffix As MSForms.CommandButton\nAttribute mBtnFrameCopyWithSuffix.VB_VarHelpID = -1\n'
          new_decl = old_decl + 'Private WithEvents mBtnFrameCF2Static As MSForms.CommandButton\nAttribute mBtnFrameCF2Static.VB_VarHelpID = -1\n'
          assert s.count(old_decl) == 1, s.count(old_decl)
          s = s.replace(old_decl, new_decl)

          marker = 'Private Sub mBtnFrameCopyWithSuffix_Click()\n    Me.txtSuffix.Value = mTxtFrameSuffix.Value\n    btnCopyWithSuffix_Click\n    SyncFrameHostedControlState\nEnd Sub\n'
          event = marker + '\nPrivate Sub mBtnFrameCF2Static_Click()\n    modCF2Static.RunCF2Static Me\nEnd Sub\n'
          assert s.count(marker) == 1, s.count(marker)
          s = s.replace(marker, event)

          insert_before = 'Private Sub EnsureCopyOptionsControls()\n'
          method = '''Public Sub InitializeCF2StaticButton()\n    Const CONTROL_GAP As Single = 6\n    Const TOOLTIP_TEXT As String = "Creates copies of selected files and converts conditional formatting to static formatting in all worksheets while preserving the exact visible appearance."\n\n    EnsureLayoutMenuControls\n    If mFraCopy Is Nothing Or mBtnFrameCopyBreakLinks Is Nothing Or mChkFrameOpenCopiedFiles Is Nothing Then Exit Sub\n\n    If mBtnFrameCF2Static Is Nothing Then\n        Set mBtnFrameCF2Static = GetFrameControlIfExists(mFraCopy, "CF2Static")\n        If mBtnFrameCF2Static Is Nothing Then Set mBtnFrameCF2Static = mFraCopy.Controls.Add("Forms.CommandButton.1", "CF2Static", True)\n    End If\n\n    With mBtnFrameCF2Static\n        .Caption = "CF2Static"\n        .ControlTipText = TOOLTIP_TEXT\n        .Left = mBtnFrameCopyBreakLinks.Left\n        .TOP = mChkFrameOpenCopiedFiles.TOP + mChkFrameOpenCopiedFiles.Height + CONTROL_GAP\n        .Width = mBtnFrameCopyBreakLinks.Width\n        .Height = mBtnFrameCopyBreakLinks.Height\n        .Font.Name = mBtnFrameCopyBreakLinks.Font.Name\n        .Font.Size = mBtnFrameCopyBreakLinks.Font.Size\n        .Font.Bold = mBtnFrameCopyBreakLinks.Font.Bold\n        .Font.Italic = mBtnFrameCopyBreakLinks.Font.Italic\n        .SpecialEffect = mBtnFrameCopyBreakLinks.SpecialEffect\n        .Visible = True\n        .enabled = True\n    End With\nEnd Sub\n\n'''
          assert s.count(insert_before) == 1, s.count(insert_before)
          s = s.replace(insert_before, method + insert_before)

          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- VBA/frmExcelNavigator.frm
          git commit -m "Handle CF2Static event directly in form"
          git push origin HEAD:feature/cf2static-v6.1
